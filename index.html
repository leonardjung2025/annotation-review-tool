<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A spacious, annotated product review of the lululemon chat experience."
    />
    <title>Lululemon chat review</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="masthead">
      <p class="eyebrow">Sierra / Product review</p>
      <h1>Lululemon chat</h1>
      <p class="date">July 23, 2026</p>
    </header>

    <main>
      <section class="review" aria-labelledby="review-title">
        <div class="section-heading">
          <p class="index">01</p>
          <div>
            <h2 id="review-title">Opening state</h2>
          </div>
        </div>

        <div class="review-canvas">
          <figure class="screenshot screenshot-opening">
            <article class="annotation annotation-trust">
              <p class="annotation-label">Trust</p>
              <p>
                “I can help with lots” overpromises without specifics, lowering
                trust in the opening.
              </p>
            </article>
            <img
              src="/review-opening.png?v=512"
              alt="Opening state of the Ask lululemon chat panel"
            />
            <span class="callout-line" aria-hidden="true"></span>
            <span class="callout-endpoint" aria-hidden="true"></span>
          </figure>
        </div>
      </section>

      <section class="review" id="on-product-page" aria-labelledby="pdp-title">
        <div class="section-heading">
          <p class="index">02</p>
          <div>
            <h2 id="pdp-title">On product page</h2>
          </div>
        </div>

        <div class="review-canvas">
          <figure class="screenshot screenshot-pdp">
            <article class="annotation annotation-value">
              <p class="annotation-label">Value</p>
              <p>
                A single sizing chip makes chat feel like PDP duplication, so
                users may bounce before trying it.
              </p>
            </article>
            <img
              src="/review-pdp.png?v=512"
              alt="Ask lululemon chat on a product page with a sizing chart suggestion"
            />
            <span class="callout-line" aria-hidden="true"></span>
            <span class="callout-endpoint" aria-hidden="true"></span>
          </figure>
        </div>
      </section>

      <section class="review" id="sizing-response" aria-labelledby="sizing-title">
        <div class="section-heading">
          <p class="index">03</p>
          <div>
            <h2 id="sizing-title">Sizing response</h2>
          </div>
        </div>

        <div class="review-canvas">
          <figure class="screenshot screenshot-sizing">
            <article class="annotation annotation-utility">
              <p class="annotation-label">Utility</p>
              <p>
                Linking to the size guide adds no insight beyond what users
                could find themselves—no AI unpacking at all.
              </p>
            </article>
            <img
              src="/review-sizing-link.png?v=512"
              alt="Ask lululemon chat response linking out to the sizing guide"
            />
            <span class="callout-line" aria-hidden="true"></span>
            <span class="callout-endpoint" aria-hidden="true"></span>
          </figure>
        </div>
      </section>

      <section class="review" id="sizing-intent" aria-labelledby="intent-title">
        <div class="section-heading">
          <p class="index">04</p>
          <div>
            <h2 id="intent-title">Size &amp; fit</h2>
          </div>
        </div>

        <div class="review-canvas">
          <figure class="screenshot screenshot-intent">
            <article class="annotation annotation-guidance">
              <p class="annotation-label">Guidance</p>
              <p>
                Generic chips make users self-diagnose—AI should recognize
                size-and-fit intent and surface the paths that apply.
              </p>
            </article>
            <img
              src="/review-sizing-burden.png?v=512"
              alt="Ask lululemon chat asking users to choose between generic sizing chips"
            />
            <span class="callout-line" aria-hidden="true"></span>
            <span class="callout-endpoint" aria-hidden="true"></span>
          </figure>
        </div>
      </section>

      <section class="review" id="fit-comparison" aria-labelledby="comparison-title">
        <div class="section-heading">
          <p class="index">05</p>
          <div>
            <h2 id="comparison-title">Fit comparison</h2>
          </div>
        </div>

        <div class="review-canvas">
          <figure class="screenshot screenshot-comparison">
            <article class="annotation annotation-scanability">
              <p class="annotation-label">Scanability</p>
              <p>
                The EasyFive vs ABC comparison is too dense to scan—trim copy,
                visualize the difference, and finish with tappable fit pills.
              </p>
            </article>
            <img
              src="/review-sizing-wall.png?v=512"
              alt="Ask lululemon chat with a long text-heavy EasyFive versus ABC comparison"
            />
            <span class="callout-line" aria-hidden="true"></span>
            <span class="callout-endpoint" aria-hidden="true"></span>
          </figure>
        </div>
      </section>
    </main>

    <footer>
      <p>Internal review / Sierra</p>
    </footer>
  </body>
</html>
